name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble:
    name: Assemble (arm64-v8a, optimized)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: Install SDK / NDK
        run: sdkmanager --install "platform-tools" "platforms;android-37.0" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew :app:assembleOptimized -Pspk.abis=arm64-v8a --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: argentroom-optimized-arm64
          path: app/build/outputs/apk/optimized/*.apk
          if-no-files-found: error
